<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="떨어지는 픽셀을 패들로 받아 공으로 바꾸는 레인보우 브레이커.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>레인보우 브레이커</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<main class="app" aria-label="레인보우 브레이커 게임">
  <header class="topbar"><div class="wordmark"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>레인보우 브레이커</h1></div><div class="toolbar"><button id="sound" type="button" aria-pressed="false" aria-label="효과음 켜기">소리 끔</button><button id="pause" type="button" aria-label="게임 일시정지" disabled>일시정지</button></div></header>
  <section class="scoreboard" aria-label="게임 기록"><div><span>점수</span><strong id="score">0</strong></div><div><span>최고 기록</span><strong id="best">0</strong></div><div class="stage"><span>남은 픽셀</span><strong id="stage">5850</strong></div></section>
  <div class="arena" id="arena">
    <canvas id="board" width="390" height="680" tabindex="0" role="img" aria-label="무지개 벽돌 게임판. 방향키로 패들을 움직이고 스페이스로 시작, P로 일시정지합니다.">게임을 하려면 JavaScript와 캔버스를 지원하는 브라우저가 필요합니다.</canvas>
    <div class="field-meta" aria-hidden="true"><span id="lives">기회 3</span><span id="balls">공 1</span></div>
    <section class="overlay" id="overlay" aria-labelledby="overlayTitle"><div class="overlay-body"><div class="rain-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><h2 id="overlayTitle">레인보우 브레이커</h2><p id="overlayText">조각을 받으면 공이 됩니다.<br>게임판 어디서든 좌우로 드래그하세요.</p><button class="primary" id="primary" type="button">플레이</button><p class="hint" id="overlayHint">기회는 세 번, 끝까지 받아봐요.</p></div></section>
  </div>
  <footer class="bottom"><p id="instruction">떨어지는 조각을 모아 공으로.</p><button id="restart" type="button">다시 시작</button></footer>
  <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
  <noscript><p class="noscript">JavaScript를 켜면 게임을 플레이할 수 있어요.</p></noscript>
</main>
<dialog id="confirm" aria-labelledby="confirmTitle"><h2 id="confirmTitle">처음부터 다시 할까요?</h2><p>현재 점수와 진행 상황이 초기화돼요.</p><div class="dialog-actions"><button id="cancel" type="button">계속하기</button><button id="confirmRestart" class="primary" type="button">다시 시작</button></div></dialog>
</body>
</html>
